<!DOCTYPE html>
<html>
<head>
    <title>Test API audit-cwu</title>
</head>
<body>
    <h1>Test API /api/audit-cwu</h1>
    <div id="result"></div>
    
    <script>
        // Test API endpoint
        fetch('/api/audit-cwu', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                liczba_mieszkan: "50",
                liczba_pionow: "4",
                temp_zimnej_wody: "10",
                temp_cwu: "55",
                procent_strat_cyrkulacji: "10"
            })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        })
        .catch(error => {
            document.getElementById('result').innerHTML = 'Błąd: ' + error;
        });
    </script>
</body>
</html>
